board: ESP32 DevKit (Dune Weaver Mini)
name: Dune Weaver Mini ThetaRho
meta: DW Mini fork - 28BYJ-48 + ULN2003, OTA-slot pattern cache
hostname: DWMINI
# Pins, steps/mm and travel come from the table's original FluidNC 3.0
# config (backups/board-config-2026-11-20.yaml). Kinematics reproduce the
# legacy host's Mini math: x 100/(2pi*2) mm per rad = 50 mm/rev,
# y 100/3.7 = 27.027 mm of rho, coupling subtracted (invert_coupling).
stepping:
  engine: Timed
  idle_ms: 250
  pulse_us: 10
  dir_delay_us: 1
  disable_delay_us: 0
  segments: 12
# No card: /sd is a LittleFS cache in the spare OTA slot (~1.9 MB).
sdcard:
  ota_cache: true
  card_detect_pin: NO_PIN
kinematics:
  ThetaRho:
    theta_mm_per_rev: 50
    rho_mm: 27.027
    gear_ratio: 6.25
    invert_coupling: true
    default_feed_mm_per_min: 140
axes:
  shared_stepper_disable_pin: gpio.13
  x:
    steps_per_mm: 256
    max_rate_mm_per_min: 200
    acceleration_mm_per_sec2: 10
    max_travel_mm: 4000
    soft_limits: false
    motor0:
      hard_limits: false
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      unipolar:
        phase0_pin: gpio.14
        phase1_pin: gpio.12
        phase2_pin: gpio.26
        phase3_pin: gpio.27
        half_step: false
# y max_travel_mm is the crash-home drive into the centre stop, in RHO
# units (the jog goes through ThetaRho): the legacy host jogged 30 mm,
# 30 / 27.027 = 1.11. (DW Mini Pro: 1.1 = its legacy 22 mm / 20.)
  y:
    steps_per_mm: 180
    max_rate_mm_per_min: 200
    acceleration_mm_per_sec2: 10
    max_travel_mm: 1.11
    soft_limits: false
    motor0:
      hard_limits: false
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      unipolar:
        phase0_pin: gpio.16
        phase1_pin: gpio.17
        phase2_pin: gpio.18
        phase3_pin: gpio.19
        half_step: false
macros:
  startup_line0: $Sand/Home
start:
  must_home: false
  deactivate_parking: false
  check_limits: false
arc_tolerance_mm: 0.002
junction_deviation_mm: 0.04
verbose_errors: true
report_inches: false
planner_blocks: 16
playlist:
  folder: /playlists
  clear_from_in: /patterns/clear_from_in_mini.thr
  clear_from_out: /patterns/clear_from_out_mini.thr
  clear_sideway: /patterns/clear_sideway_mini.thr
time:
  ntp: true
  server: pool.ntp.org
  tz: UTC0
